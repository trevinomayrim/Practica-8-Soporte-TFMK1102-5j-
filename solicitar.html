
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Nombre que se muestra en la pestaña del navegador -->
    <title>Solicitar Soporte</title>
    
    <!--CSS -->
    <style>
        /* Estilo general de toda la página */
        body {
            background-color: #e6f2ff; /* Color de fondo de la página */
            color: #000000;            /* Color del texto */
            font-family: Arial;        /* Tipo de letra para todo el texto */
            margin: 0;                 /* Quita el margen exterior por defecto del navegador */
        }

        /* Estilo título principal */
        h1 {
            color: #003366;            /* Color del texto */
            padding: 15px;             /* Espacio alrededor del texto por dentro */
            text-align: center;        /* Centra el texto en la pantalla */
            margin: 0;                 /* Quita el espacio exterior por defecto */
        }

        /* Estilo barra de navegación */
        nav {
            background-color: #3498db; /* Color de fondo de la franja */
            padding: 10px;             /* Espacio interior de la barra */
            text-align: center;        /* Centra los enlaces contenidos */
        }

        /* Estilo enlaces dentro de la barra */
        nav a {
            color: white;              /* Color del texto del enlace */
            text-decoration: none;    /* Elimina la línea subrayada por defecto */
            margin: 0 15px;            /* Espacio horizontal entre cada enlace */
        }

        /* Estilo al pasar el cursor sobre el enlace */
        nav a:hover {
            color: #ffcc00;            /* Cambia el color del texto */
            text-decoration: underline;/* Muestra línea debajo del texto */
        }

        /* Estilo del bloque principal de contenido */
        main {
            padding: 20px;             /* Espacio alrededor del contenido */
        }

        /* Estilo para títulos de segundo nivel */
        h2 {
            text-align: center;        /* Centra el texto */
            color: #003366;            /* Color del texto */
        }

        /* Estilo del formulario */
        form {
            background: white;         /* Color de fondo del recuadro del formulario */
            padding: 20px;             /* Espacio interior entre el borde y los campos */
            border: 2px solid #99ccff; /* Borde: grosor, tipo línea continua, color */
            max-width: 400px;          /* Ancho máximo que puede alcanzar el formulario */
            margin: 0 auto;            /* Centra el formulario */
        }

        /* Estilo para campos de entrada, lista desplegable y área de texto */
        input, select, textarea {
            width: 100%;               /* Ocupa todo el ancho disponible dentro del formulario */
            padding: 7px;              /* Espacio interior dentro de la caja */
            margin: 5px 0 12px 0;      /* Espacio exterior*/
            box-sizing: border-box;   /* Incluye borde y relleno en el ancho total definido */
        }

        /* Estilo del botón de envío */
        button {
            background-color: #27ae60; /* Color de fondo del botón */
            color: white;              /* Color del texto del botón */
            border: none;              /* Elimina el borde  del botón */
            padding: 10px;             /* Espacio interior del botón */
            width: 100%;               /* El botón ocupa todo el ancho del formulario */
            
        }

        /* Estilo del pie de página */
        footer {
            text-align: center;        /* Centra el texto */
            padding: 10px;             /* Espacio interior */
            margin-top: 20px;          /* Espacio que separa del contenido de arriba */
        }
    </style>
    <!-- Fin del bloque de estilos -->
</head>

<body>

    <!-- Título principal de la página -->
    <h1>Solicitar Asistencia Técnica</h1>

    <!-- Barra de navegación con enlaces -->
    <nav>
        <!-- href indica la página que se abre al hacer clic -->
        <a href="index.html">Inicio</a>
        <a href="solicitar.html">Solicitar Soporte</a>
    </nav>

    <!-- main: contenido principal de la página -->
    <main>
        <!-- Subtítulo -->
        <h2>Completa el Formulario</h2>
        
        <!-- form: crea un formulario para recopilar datos
             action="#" = los datos se envían a la misma página (ejemplo)
             method="post" = método seguro para enviar información -->
        <form action="#" method="post">
            
            <!-- label: texto descriptivo de un campo -->
            <label>Nombre Completo:</label>
           
            <input type="text" name="nombre" required>
              <!-- input = campo de entrada de texto
                 type="text" = acepta cualquier texto
                 name = nombre para identificar el dato enviado
                 required = campo obligatorio, no se puede enviar vacío -->

            <label>Correo Electrónico:</label>
            
            <!-- type="email" = valida que el texto tenga formato de correo -->
            <input type="email" name="correo" required>

            <label>Teléfono:</label>
            
            <!-- type="tel" = campo para números telefónicos -->
            <input type="tel" name="telefono" required>

            <label>Tipo de Equipo:</label>
            
            <!-- select = lista desplegable para elegir una opción -->
            <select name="equipo">
                
                <!-- option = cada opción disponible en la lista -->
                <option>Computadora de Escritorio</option>
                <option>Laptop / Portátil</option>
                <option>Otro dispositivo</option>
            </select>

            <label>Marca y Modelo:</label>
            <input type="text" name="marca">

            <label>Describe tu problema:</label>
            
            <!-- textarea = campo de texto con varias líneas
                 rows = número de líneas visibles en la caja -->
            <textarea name="problema" rows="4" required></textarea>

            <label>Nivel de Urgencia:</label>
            <select name="urgencia">
                <option>Puede esperar</option>
                <option>Normal</option>
                <option>Urgente</option>
            </select>

            <!-- button = botón para enviar el formulario
                 type="submit" = envía todos los datos del formulario -->
            <button type="submit">Enviar Solicitud</button>
        </form>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>Treviño Fierro Mayrim Kassandra | 5-J | Matrícula: 1102 | Práctica 8</p>
    </footer>

</body>
</html>
